name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and redeploy
        run: |
          git config --global --add safe.directory /home/actions-runner/Joblin
          cd /home/actions-runner/Joblin
          git pull origin main
          docker compose up -d --build
